[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vinyl-set-builder"
version = "0.1.0"
description = "Строит гармонически и по темпу совместимый порядок DJ-сета из крейта виниловых треков"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "mypy>=1.9",
    "httpx>=0.27",
]

[tool.hatch.build.targets.wheel]
packages = ["src/vinyl_set_builder"]

[tool.mypy]
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
